<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sahayak - clickable prototype | CodeNova</title>
<style>
  :root{
    --ink:#15202B; --muted:#4A5B6C; --line:#CBD5DF; --surface:#EEF2F6; --page:#DDE4EB;
    --brand:#1D4E89; --brand-dark:#143A68; --ok:#2A7A4B; --warn:#8A5200;
  }
  *{box-sizing:border-box}
  html{font-size:18px}
  body{margin:0;background:var(--page);color:var(--ink);
    font-family:"Noto Sans Devanagari","Mukta",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
  .app{max-width:420px;min-height:100vh;margin:0 auto;background:#fff;display:flex;flex-direction:column}
  header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--line)}
  header strong{font-size:1.1rem}
  .lang{display:flex;border:1.5px solid var(--brand);border-radius:8px;overflow:hidden}
  .lang button{border:0;background:#fff;color:var(--brand);font:inherit;font-size:.85rem;padding:6px 12px;cursor:pointer}
  .lang button[aria-pressed="true"]{background:var(--brand);color:#fff}
  .note{margin:0;padding:8px 20px;background:var(--surface);font-size:.8rem;color:var(--muted)}
  main{flex:1;padding:24px 20px 32px}
  section[hidden]{display:none}
  .step{margin:0 0 4px;font-size:.85rem;color:var(--muted)}
  h1{font-size:1.6rem;line-height:1.25;margin:0 0 8px}
  p.lead{margin:0 0 20px;color:var(--muted)}
  button,select,textarea,input{font:inherit}
  :focus-visible{outline:3px solid #F2A33A;outline-offset:2px}
  .mic{display:block;margin:8px auto 4px;width:120px;height:120px;border-radius:50%;border:0;background:var(--brand);color:#fff;cursor:pointer;position:relative}
  .mic svg{width:48px;height:48px;fill:#fff}
  .mic.on{background:#B3261E}
  .mic.on::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:3px solid #B3261E;animation:ring 1.2s ease-out infinite}
  @keyframes ring{from{opacity:.9;transform:scale(.9)}to{opacity:0;transform:scale(1.2)}}
  @media (prefers-reduced-motion:reduce){.mic.on::after{animation:none}}
  .mic-label{text-align:center;font-weight:600;margin:0}
  .status{text-align:center;min-height:1.6em;color:var(--muted);font-size:.9rem;margin:4px 0 16px}
  label{display:block;font-weight:600;margin:16px 0 6px}
  textarea,select{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:12px;background:#fff;color:var(--ink)}
  textarea{min-height:104px;resize:vertical}
  .hint{font-size:.8rem;color:var(--muted);margin:4px 0 0}
  .row{display:flex;gap:10px;margin-top:20px}
  .btn{flex:1;border-radius:10px;padding:14px 16px;border:1.5px solid var(--brand);background:var(--brand);color:#fff;font-weight:600;cursor:pointer}
  .btn:hover{background:var(--brand-dark)}
  .btn.secondary{background:#fff;color:var(--brand)}
  .btn[disabled]{opacity:.45;cursor:not-allowed}
  .link{background:none;border:0;color:var(--brand);text-decoration:underline;cursor:pointer;padding:6px 0;font-size:.9rem}
  .attach{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .attach .btn{flex:none;padding:10px 14px}
  .ok{color:var(--ok);font-weight:600;font-size:.9rem}
  .ref{display:inline-block;background:var(--surface);border-radius:8px;padding:4px 10px;font-weight:600;letter-spacing:.5px}
  ol.timeline{list-style:none;margin:20px 0 0;padding:0}
  ol.timeline li{position:relative;padding:0 0 22px 36px;color:var(--muted)}
  ol.timeline li::before{content:"";position:absolute;left:5px;top:6px;width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid var(--line)}
  ol.timeline li::after{content:"";position:absolute;left:11px;top:22px;bottom:-2px;width:2px;background:var(--line)}
  ol.timeline li:last-child::after{display:none}
  ol.timeline li.done{color:var(--ink)}
  ol.timeline li.done::before{background:var(--ok);border-color:var(--ok)}
  ol.timeline li.now{color:var(--ink);font-weight:600}
  ol.timeline li.now::before{background:#F2A33A;border-color:#F2A33A}
  .toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);max-width:380px;width:calc(100% - 32px);background:var(--ink);color:#fff;border-radius:10px;padding:12px 16px;font-size:.9rem}
  .toast[hidden]{display:none}
  .summary{background:var(--surface);border-radius:10px;padding:12px 14px;font-size:.9rem;margin-top:12px}
  .summary p{margin:2px 0}
</style>
</head>
<body>
<div class="app">
  <header>
    <strong>Sahayak</strong>
    <div class="lang" role="group" aria-label="Language">
      <button id="lang-hi" aria-pressed="true">हिन्दी</button>
      <button id="lang-en" aria-pressed="false">English</button>
    </div>
  </header>
  <p class="note" data-i18n="note"></p>

  <main>
    <!-- 1: describe -->
    <section id="s1">
      <p class="step" data-i18n="step1"></p>
      <h1 data-i18n="h1"></h1>
      <p class="lead" data-i18n="lead1"></p>
      <button class="mic" id="mic" aria-label="Speak your problem">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a4 4 0 0 0 4-4V6a4 4 0 0 0-8 0v5a4 4 0 0 0 4 4zm6-4a6 6 0 0 1-12 0H4a8 8 0 0 0 7 7.94V22h2v-3.06A8 8 0 0 0 20 11h-2z"/></svg>
      </button>
      <p class="mic-label" data-i18n="speak"></p>
      <p class="status" id="status" aria-live="polite"></p>
      <label for="problem" data-i18n="orType"></label>
      <textarea id="problem"></textarea>
      <button class="link" id="example" data-i18n="example"></button>
      <div class="row"><button class="btn" id="go2" disabled data-i18n="continue"></button></div>
    </section>

    <!-- 2: review -->
    <section id="s2" hidden>
      <p class="step" data-i18n="step2"></p>
      <h1 data-i18n="h2"></h1>
      <p class="lead" data-i18n="lead2"></p>
      <label for="problem2" data-i18n="fProblem"></label>
      <textarea id="problem2"></textarea>
      <label for="dept" data-i18n="fDept"></label>
      <select id="dept"></select>
      <p class="hint" data-i18n="deptHint"></p>
      <label data-i18n="fLoc"></label>
      <div class="attach"><button class="btn secondary" id="loc" data-i18n="addLoc"></button><span class="ok" id="locOk"></span></div>
      <label data-i18n="fPhoto"></label>
      <div class="attach">
        <input type="file" id="photo" accept="image/*" hidden>
        <button class="btn secondary" id="photoBtn" data-i18n="addPhoto"></button><span class="ok" id="photoOk"></span>
      </div>
      <div class="row">
        <button class="btn secondary" id="back1" data-i18n="back"></button>
        <button class="btn" id="submit" data-i18n="submit"></button>
      </div>
    </section>

    <!-- 3: track -->
    <section id="s3" hidden>
      <p class="step" data-i18n="step3"></p>
      <h1 data-i18n="h3"></h1>
      <p class="lead"><span data-i18n="refLabel"></span> <span class="ref" id="ref"></span></p>
      <div class="summary" id="summary"></div>
      <ol class="timeline" id="timeline" aria-label="Complaint progress"></ol>
      <div class="row">
        <button class="btn secondary" id="again" data-i18n="again"></button>
        <button class="btn" id="next" data-i18n="next"></button>
      </div>
    </section>
  </main>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
const T = {
  hi: {
    note:"प्रोटोटाइप: कुछ भी CM हेल्पलाइन को नहीं भेजा जाता।",
    step1:"चरण 1 / 3", step2:"चरण 2 / 3", step3:"चरण 3 / 3",
    h1:"बताइए, क्या दिक्कत है?", lead1:"अपनी भाषा में बोलिए। फ़ॉर्म हम भर देंगे।",
    speak:"अपनी समस्या बोलिए", orType:"या यहाँ लिखिए", example:"उदाहरण भरें", continue:"आगे बढ़ें",
    listening:"सुन रहे हैं... बोलिए", heard:"सुन लिया। नीचे जाँच लीजिए।", noVoice:"इस ब्राउज़र में आवाज़ काम नहीं करती। कृपया लिखिए।", voiceErr:"आवाज़ सुनाई नहीं दी। दोबारा कोशिश कीजिए या लिखिए।",
    h2:"शिकायत जाँच लीजिए", lead2:"हमने विभाग सुझाया है। ज़रूरत हो तो बदलिए।",
    fProblem:"समस्या", fDept:"विभाग", deptHint:"आपकी बात के आधार पर सुझाया गया। उदाहरण विभाग।", fLoc:"स्थान", addLoc:"मेरा स्थान जोड़ें", locDone:"स्थान जुड़ गया", locSample:"देहरादून (नमूना स्थान)",
    fPhoto:"फ़ोटो", addPhoto:"फ़ोटो जोड़ें", back:"वापस", submit:"शिकायत दर्ज करें",
    h3:"शिकायत दर्ज हो गई", refLabel:"संदर्भ संख्या:", again:"नई शिकायत", next:"अगला अपडेट दिखाएँ", resolved:"शिकायत का समाधान हो गया",
    stages:["शिकायत मिली","विभाग को भेजी गई","काम शुरू हुआ","समाधान हुआ"],
    sms:(r,s)=>`SMS: आपकी शिकायत ${r} अब: ${s}`,
    depts:{street:"स्ट्रीट लाइट और बिजली",water:"पेयजल",roads:"सड़क और पुल",waste:"सफ़ाई और कूड़ा",other:"अन्य"},
    sLoc:"स्थान", sPhoto:"फ़ोटो", yes:"जुड़ी है", no:"नहीं"
  },
  en: {
    note:"Prototype: nothing is sent to CM Helpline.",
    step1:"Step 1 of 3", step2:"Step 2 of 3", step3:"Step 3 of 3",
    h1:"Tell us what's wrong", lead1:"Speak in your own language. We'll fill in the form.",
    speak:"Speak your problem", orType:"Or type it here", example:"Fill an example", continue:"Continue",
    listening:"Listening... go ahead", heard:"Got it. Check the text below.", noVoice:"Voice isn't available in this browser. Please type instead.", voiceErr:"Couldn't hear you. Try again or type instead.",
    h2:"Check your complaint", lead2:"We suggested a department. Change it if needed.",
    fProblem:"Problem", fDept:"Department", deptHint:"Suggested from what you said. Example departments.", fLoc:"Location", addLoc:"Add my location", locDone:"Location added", locSample:"Dehradun (sample location)",
    fPhoto:"Photo", addPhoto:"Add a photo", back:"Back", submit:"Submit complaint",
    h3:"Complaint submitted", refLabel:"Reference number:", again:"File another complaint", next:"Show next update", resolved:"Complaint resolved",
    stages:["Received","Sent to department","Work started","Resolved"],
    sms:(r,s)=>`SMS: Your complaint ${r} is now: ${s}`,
    depts:{street:"Street lights and electricity",water:"Drinking water",roads:"Roads and bridges",waste:"Sanitation and waste",other:"Other"},
    sLoc:"Location", sPhoto:"Photo", yes:"added", no:"none"
  }
};
const KEYS = {
  street:["light","lamp","electric","power","बिजली","लाइट","स्ट्रीट","खंभा"],
  water:["water","tap","pipe","पानी","नल","जल","पाइप"],
  roads:["road","pothole","bridge","सड़क","गड्ढ","पुल","रास्ता"],
  waste:["garbage","waste","drain","sewer","clean","कूड़ा","कचरा","नाली","सफाई","सफ़ाई"]
};
const SAMPLE = { hi:"गली की स्ट्रीट लाइट तीन हफ्ते से खराब है", en:"The street light on our lane has not worked for three weeks" };

let lang="hi", stage=0, located=false, photoName="", refNo="", rec=null;
const $=id=>document.getElementById(id);

function applyLang(l){
  lang=l; document.documentElement.lang=l;
  $("lang-hi").setAttribute("aria-pressed",l==="hi"); $("lang-en").setAttribute("aria-pressed",l==="en");
  document.querySelectorAll("[data-i18n]").forEach(e=>e.textContent=T[l][e.dataset.i18n]);
  $("problem").placeholder = l==="hi" ? "जैसे: हमारी गली में पानी नहीं आ रहा" : "For example: there is no water in our lane";
  const cur=$("dept").value; fillDepts(cur||guess($("problem2").value||$("problem").value));
  if(located) $("locOk").textContent=T[l].locDone;
  if(photoName) $("photoOk").textContent=photoName;
  if(!$("s3").hidden) renderTrack();
}
function fillDepts(sel){
  $("dept").innerHTML=Object.entries(T[lang].depts).map(([k,v])=>`<option value="${k}"${k===sel?" selected":""}>${v}</option>`).join("");
}
function guess(text){
  const t=(text||"").toLowerCase();
  for(const [k,words] of Object.entries(KEYS)) if(words.some(w=>t.includes(w))) return k;
  return "other";
}
function show(id){ ["s1","s2","s3"].forEach(s=>$(s).hidden=(s!==id)); window.scrollTo(0,0); }
function toast(msg){ const t=$("toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast.h); toast.h=setTimeout(()=>t.hidden=true,3500); }

// voice
const SR = window.SpeechRecognition||window.webkitSpeechRecognition;
$("mic").addEventListener("click",()=>{
  if(!SR){ $("status").textContent=T[lang].noVoice; $("problem").focus(); return; }
  if(rec){ rec.stop(); return; }
  rec=new SR(); rec.lang= lang==="hi" ? "hi-IN" : "en-IN"; rec.interimResults=false;
  rec.onstart=()=>{ $("mic").classList.add("on"); $("status").textContent=T[lang].listening; };
  rec.onresult=e=>{ $("problem").value=e.results[0][0].transcript; $("status").textContent=T[lang].heard; update(); };
  rec.onerror=()=>{ $("status").textContent=T[lang].voiceErr; };
  rec.onend=()=>{ $("mic").classList.remove("on"); rec=null; };
  rec.start();
});
function update(){ $("go2").disabled=!$("problem").value.trim(); }
$("problem").addEventListener("input",update);
$("example").addEventListener("click",()=>{ $("problem").value=SAMPLE[lang]; update(); });

$("go2").addEventListener("click",()=>{
  const p=$("problem").value.trim();
  $("problem2").value=p; fillDepts(guess(p)); show("s2");
});
$("back1").addEventListener("click",()=>show("s1"));

$("loc").addEventListener("click",()=>{
  const done=()=>{ located=true; $("locOk").textContent=T[lang].locDone; };
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(done,()=>{ done(); toast(T[lang].locSample); },{timeout:6000});
  } else { done(); toast(T[lang].locSample); }
});
$("photoBtn").addEventListener("click",()=>$("photo").click());
$("photo").addEventListener("change",e=>{ const f=e.target.files[0]; photoName=f?f.name:""; $("photoOk").textContent=photoName; });

$("submit").addEventListener("click",()=>{
  refNo="CM-"+String(Math.floor(100000+Math.random()*900000)); stage=0; show("s3"); renderTrack();
});
function renderTrack(){
  const t=T[lang]; $("ref").textContent=refNo;
  $("summary").innerHTML=`<p><strong>${$("problem2").value.trim()}</strong></p><p>${t.depts[$("dept").value]}</p><p>${t.sLoc}: ${located?t.yes:t.no} · ${t.sPhoto}: ${photoName?t.yes:t.no}</p>`;
  $("timeline").innerHTML=t.stages.map((s,i)=>`<li class="${i<stage?"done":i===stage?"now":""}">${s}</li>`).join("");
  $("next").disabled = stage>=t.stages.length-1;
  $("next").textContent = stage>=t.stages.length-1 ? t.resolved : t.next;
}
$("next").addEventListener("click",()=>{
  if(stage<T[lang].stages.length-1){ stage++; renderTrack(); toast(T[lang].sms(refNo,T[lang].stages[stage])); }
});
$("again").addEventListener("click",()=>{
  $("problem").value=""; $("problem2").value=""; located=false; photoName=""; $("locOk").textContent=""; $("photoOk").textContent=""; $("photo").value="";
  $("status").textContent=""; update(); show("s1");
});
$("lang-hi").addEventListener("click",()=>applyLang("hi"));
$("lang-en").addEventListener("click",()=>applyLang("en"));
applyLang("hi");
</script>
</body>
</html>
